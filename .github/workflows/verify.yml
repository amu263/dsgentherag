name: Verify site

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build (no dependencies)
        run: node site/scripts/build.mjs
        env:
          SITE_URL: https://amu263.github.io/
      - name: Link and markup check
        run: node site/scripts/check.mjs
